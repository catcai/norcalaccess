const COLORS = { NgTG:'#DD8452', NgB:'#4C72B0' };
const mean = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
const variance = arr => { const m=mean(arr); return arr.reduce((s,x)=>s+(x-m)**2,0)/(arr.length-1); };
const sem  = arr => Math.sqrt(variance(arr)/arr.length);

function welch(a,b){
  const ma=mean(a),mb=mean(b),va=variance(a),vb=variance(b),na=a.length,nb=b.length;
  const se=Math.sqrt(va/na+vb/nb),t=(ma-mb)/se;
  const df=(va/na+vb/nb)**2/((va/na)**2/(na-1)+(vb/nb)**2/(nb-1));
  const x=df/(df+t*t);
  return {t,df,p:rib(df/2,0.5,x)};
}
function rib(a,b,x){
  if(x<=0)return 0; if(x>=1)return 1;
  const lb=lg(a)+lg(b)-lg(a+b);
  const bt=Math.exp(Math.log(x)*a+Math.log(1-x)*b-lb);
  return x<(a+1)/(a+b+2)?bt*bcf(a,b,x)/a:1-bt*bcf(b,a,1-x)/b;
}
function bcf(a,b,x){
  const qab=a+b,qap=a+1,qam=a-1,FP=1e-30;
  let c=1,d=1-qab*x/qap; if(Math.abs(d)<FP)d=FP; d=1/d; let h=d;
  for(let m=1;m<=200;m++){
    let m2=2*m,aa=m*(b-m)*x/((qam+m2)*(a+m2));
    d=1+aa*d;if(Math.abs(d)<FP)d=FP;c=1+aa/c;if(Math.abs(c)<FP)c=FP;d=1/d;h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));
    d=1+aa*d;if(Math.abs(d)<FP)d=FP;c=1+aa/c;if(Math.abs(c)<FP)c=FP;d=1/d;let del=d*c;h*=del;
    if(Math.abs(del-1)<3e-7)break;
  }
  return h;
}
function lg(x){
  const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,1.208650973866179e-3,-5.395239384953e-6];
  let y=x,tmp=x+5.5;tmp-=(x+0.5)*Math.log(tmp);let s=1.000000000190015;
  for(let j=0;j<6;j++)s+=c[j]/++y;
  return -tmp+Math.log(2.5066282746310005*s/x);
}
function pLabel(p){
  if(p<0.001)return 'p < 0.001';
  if(p<0.05) return `p = ${p.toFixed(3)}`;
  return `ns (p = ${p.toFixed(2)})`;
}

function makeChart(animals, title, subtitle, yLabel, decimals) {
  const wrap = document.createElement('div');
  wrap.className = 'cell';

  const hdr = document.createElement('div');
  hdr.className = 'cell-header';
  hdr.innerHTML = `<div class="chart-title">${title}</div><div class="chart-subtitle">${yLabel}</div>`;
  wrap.appendChild(hdr);

  const ngtgA = animals.filter(d=>d.grp==='NgTG');
  const ngbA  = animals.filter(d=>d.grp==='NgB');
  const vN = ngtgA.map(d=>d.mean), vB = ngbA.map(d=>d.mean);
  const gm = { NgTG: mean(vN), NgB: mean(vB) };
  const gs = { NgTG: sem(vN),  NgB: sem(vB) };
  const {t,df,p} = welch(vN,vB);

  const W=240,H=220,ml=48,mr=16,mt=20,mb=40;
  const cw=W-ml-mr,ch=H-mt-mb;
  const maxY = Math.max(gm.NgTG+gs.NgTG, gm.NgB+gs.NgB)*1.4 || 1;
  const y = v => mt+ch*(1-v/maxY);
  const nTicks=4;

  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  svg.setAttribute('class','bar-chart');

  // grid
  for(let i=0;i<=nTicks;i++){
    const val=maxY*i/nTicks, yy=y(val);
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',ml);line.setAttribute('x2',ml+cw);
    line.setAttribute('y1',yy);line.setAttribute('y2',yy);
    line.setAttribute('class',i===0?'axis-line':'grid-line');
    svg.appendChild(line);
    if(i>0){
      const lbl=document.createElementNS('http://www.w3.org/2000/svg','text');
      lbl.setAttribute('x',ml-4);lbl.setAttribute('y',yy+3);
      lbl.setAttribute('text-anchor','end');lbl.setAttribute('class','tick-label');
      lbl.textContent=val<1?val.toFixed(decimals):Math.round(val);
      svg.appendChild(lbl);
    }
  }

  // y label
  const axl=document.createElementNS('http://www.w3.org/2000/svg','text');
  axl.setAttribute('transform',`translate(11,${mt+ch/2}) rotate(-90)`);
  axl.setAttribute('text-anchor','middle');axl.setAttribute('class','axis-label');
  axl.textContent=yLabel;
  svg.appendChild(axl);

  const x1=ml+cw*0.3, x2=ml+cw*0.7, bw=44;

  [['NgTG',x1,ngtgA],['NgB',x2,ngbA]].forEach(([grp,cx,anims])=>{
    const gv=gm[grp],gse=gs[grp],col=COLORS[grp];

    const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x',cx-bw/2);rect.setAttribute('width',bw);
    rect.setAttribute('y',y(gv));rect.setAttribute('height',Math.max(0,y(0)-y(gv)));
    rect.setAttribute('fill',col);rect.setAttribute('opacity','0.82');
    rect.setAttribute('class','bar');rect.setAttribute('rx','2');
    svg.appendChild(rect);

    const eT=y(gv+gse),eB=y(Math.max(0,gv-gse));
    [[cx,eT,cx,eB],[cx-5,eT,cx+5,eT],[cx-5,eB,cx+5,eB]].forEach(([x1e,y1e,x2e,y2e])=>{
      const el=document.createElementNS('http://www.w3.org/2000/svg','line');
      el.setAttribute('x1',x1e);el.setAttribute('y1',y1e);el.setAttribute('x2',x2e);el.setAttribute('y2',y2e);
      el.setAttribute('stroke','#333');el.setAttribute('class','err-cap');
      svg.appendChild(el);
    });

    anims.forEach((a,i)=>{
      const jx=cx-11+(i%3)*11+(Math.floor(i/3)%2)*5.5;
      const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
      dot.setAttribute('cx',jx);dot.setAttribute('cy',y(a.mean));
      dot.setAttribute('r','2.5');dot.setAttribute('fill','#fff');
      dot.setAttribute('stroke',col);dot.setAttribute('stroke-width','1.5');
      dot.setAttribute('class','bar');
      dot.addEventListener('mouseenter',e=>{
        const tip=document.getElementById('tooltip');
        tip.innerHTML=`Animal ${a.id} (${grp})<br>Mean: ${a.mean.toFixed(decimals+1)}<br>SEM: ±${a.sem.toFixed(decimals+1)}<br>n=${a.n} sections`;
        tip.style.opacity=1;tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY-8)+'px';
      });
      dot.addEventListener('mousemove',e=>{
        const tip=document.getElementById('tooltip');
        tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY-8)+'px';
      });
      dot.addEventListener('mouseleave',()=>{document.getElementById('tooltip').style.opacity=0;});
      svg.appendChild(dot);
    });

    const xl=document.createElementNS('http://www.w3.org/2000/svg','text');
    xl.setAttribute('x',cx);xl.setAttribute('y',mt+ch+14);
    xl.setAttribute('text-anchor','middle');xl.setAttribute('class','tick-label');
    xl.setAttribute('font-weight','600');xl.setAttribute('fill',col);
    xl.textContent=grp;
    svg.appendChild(xl);
  });

  // bracket + p
  const by=y(Math.max(gm.NgTG+gs.NgTG,gm.NgB+gs.NgB))-12;
  [[x1,by,x1,by-5],[x1,by-5,x2,by-5],[x2,by-5,x2,by]].forEach(([ax,ay,bx,bby])=>{
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',ax);l.setAttribute('y1',ay);l.setAttribute('x2',bx);l.setAttribute('y2',bby);
    l.setAttribute('class','sig-line');svg.appendChild(l);
  });
  const pl=document.createElementNS('http://www.w3.org/2000/svg','text');
  pl.setAttribute('x',(x1+x2)/2);pl.setAttribute('y',by-7);
  pl.setAttribute('text-anchor','middle');pl.setAttribute('class','p-label');
  pl.textContent=pLabel(p);
  svg.appendChild(pl);

  wrap.appendChild(svg);
  return wrap;
}

  timepoints.forEach(tp => {
    const animals = data[tp.key][metric.key];
    const cell = makeChart(animals, metric.title, `${tp.label}`, metric.yLabel, metric.dec);
    grid.appendChild(cell);

// ── tables ─────────────────────────────────────────────────────────────────────
const tablesDiv = document.getElementById('tables');
['mo6','mo11'].forEach(tp => {
  const label = tp==='mo6'?'6 Month':'11 Month';
  const h = document.createElement('h3');
  h.style.cssText='font-size:13px;font-weight:600;margin:16px 0 6px;';
  h.textContent=label;
  tablesDiv.appendChild(h);
  const tbl = document.createElement('table');
  tbl.innerHTML=`<tr><th>Animal</th><th>Group</th><th>Total (mean)</th><th>Density /mm²</th><th>GFAP+ (mean)</th><th>n sections</th></tr>`;
  const animals = data[tp].total;
  animals.forEach((a,i)=>{
    const cls=a.grp==='NgTG'?'ngtg':'ngb';
    const d=data[tp].density[i];
    const g=data[tp].gfap[i];
    tbl.innerHTML+=`<tr><td>${a.id}</td><td class="${cls}">${a.grp}</td><td>${a.mean.toFixed(2)}</td><td>${d.mean.toFixed(2)}</td><td>${g.mean.toFixed(2)}</td><td>${a.n}</td></tr>`;

  tablesDiv.appendChild(tbl);

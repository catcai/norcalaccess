<title>Nestin+ SGZ Density — 6mo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    background: #fcfcfb;
    color: #1a1a1a;
    padding: 32px 24px;
  }
  h1 { font-size: 16px; font-weight: 600; margin-bottom: 4px; color: #111; }
  .subtitle { font-size: 12px; color: #666; margin-bottom: 32px; }
  .chart-wrap { display: inline-block; }
  .chart-title { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 4px; }
  .chart-subtitle { font-size: 11px; color: #888; margin-bottom: 12px; }
  svg.bar-chart { overflow: visible; }
  .bar { cursor: pointer; transition: opacity 0.1s; }
  .bar:hover { opacity: 0.8; }
  .err-cap { stroke-width: 1.5; stroke-linecap: round; }
  .axis-line { stroke: #ccc; stroke-width: 1; }
  .grid-line { stroke: #eee; stroke-width: 1; }
  .tick-label { font-size: 11px; fill: #555; }
  .axis-label { font-size: 11px; fill: #555; }
  .p-label { font-size: 11px; fill: #555; font-style: italic; }
  .sig-line { stroke: #555; stroke-width: 1; }
  .legend { display: flex; gap: 20px; margin-bottom: 20px; font-size: 12px; color: #444; align-items: center; }
  .legend-item { display: flex; align-items: center; gap: 6px; }

    position: fixed;
    background: rgba(30,30,30,0.92);
    color: #fff;
    padding: 7px 10px;

  }

  th, td { border: 1px solid #ddd; padding: 5px 10px; text-align: right; }

  .ngtg { color: #DD8452; font-weight: 600; }
  .ngb  { color: #4C72B0; font-weight: 600; }
</style>

<h1>Nestin+ Cell Density in SGZ — 6 Month</h1>
<p class="subtitle">Per-animal means ± SEM &nbsp;|&nbsp; NgTG n=6, NgB n=6 &nbsp;|&nbsp; Welch's two-tailed t-test</p>

<div class="legend">
  <div class="legend-item"><div class="legend-swatch" style="background:#DD8452"></div><span>NgTG — WT (animals 3,4,5,7,8,11)</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#4C72B0"></div><span>NgB — Tg (animals 1,2,6,9,10,12)</span></div>
</div>

<div class="chart-wrap">
  <div class="chart-title">Nestin+ Density (SGZ)</div>
  <div class="chart-subtitle">Cells / mm²</div>
  <svg id="chart" class="bar-chart" width="300" height="300"></svg>
</div>

<div id="tooltip"></div>

<details>
  <summary>Per-animal data table</summary>
  <table id="data-table"></table>
</details>

<script>
const perAnimal = [
  { id:3,  grp:'NgTG', mean:522.42, sem:36.33, n:13 },
  { id:4,  grp:'NgTG', mean:530.10, sem:34.95, n:14 },
  { id:5,  grp:'NgTG', mean:570.87, sem:31.67, n:18 },
  { id:7,  grp:'NgTG', mean:482.17, sem:31.92, n:16 },
  { id:8,  grp:'NgTG', mean:469.52, sem:27.82, n:12 },
  { id:11, grp:'NgTG', mean:444.05, sem:27.18, n:13 },
  { id:1,  grp:'NgB',  mean:596.87, sem:47.13, n:13 },
  { id:2,  grp:'NgB',  mean:564.92, sem:41.98, n:10 },
  { id:6,  grp:'NgB',  mean:535.95, sem:32.28, n:18 },
  { id:9,  grp:'NgB',  mean:663.42, sem:37.06, n:14 },
  { id:10, grp:'NgB',  mean:438.51, sem:35.01, n:13 },
  { id:12, grp:'NgB',  mean:499.16, sem:54.17, n:8  },
];

const COLORS = { NgTG:'#DD8452', NgB:'#4C72B0' };
const ngtg = perAnimal.filter(d=>d.grp==='NgTG');
const ngb  = perAnimal.filter(d=>d.grp==='NgB');

const mean = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
const variance = arr => { const m=mean(arr); return arr.reduce((s,x)=>s+(x-m)**2,0)/(arr.length-1); };
const sem = arr => Math.sqrt(variance(arr)/arr.length);

const valN = ngtg.map(d=>d.mean), valB = ngb.map(d=>d.mean);
const groupMeans = { NgTG: mean(valN), NgB: mean(valB) };
const groupSEM   = { NgTG: sem(valN),  NgB: sem(valB) };

function welch(a, b) {
  const ma=mean(a), mb=mean(b), va=variance(a), vb=variance(b), na=a.length, nb=b.length;
  const se=Math.sqrt(va/na+vb/nb), t=(ma-mb)/se;
  const df=(va/na+vb/nb)**2/((va/na)**2/(na-1)+(vb/nb)**2/(nb-1));
  const x=df/(df+t*t);
  const p=regularizedIncompleteBeta(df/2,0.5,x);
  return {t,df,p};
}
function regularizedIncompleteBeta(a,b,x){
  if(x<0||x>1)return NaN; if(x===0)return 0; if(x===1)return 1;
  const lbeta=lgamma(a)+lgamma(b)-lgamma(a+b);
  const bt=Math.exp(Math.log(x)*a+Math.log(1-x)*b-lbeta);
  if(x<(a+1)/(a+b+2))return bt*betacf(a,b,x)/a;
  return 1-bt*betacf(b,a,1-x)/b;
}
function betacf(a,b,x){
  const MAXIT=200,EPS=3e-7,FPMIN=1e-30,qab=a+b,qap=a+1,qam=a-1;
  let c=1,d=1-qab*x/qap; if(Math.abs(d)<FPMIN)d=FPMIN; d=1/d; let h=d;
  for(let m=1;m<=MAXIT;m++){
    let m2=2*m,aa=m*(b-m)*x/((qam+m2)*(a+m2));
    d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;
    d=1/d;h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));
    d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;
    d=1/d;let del=d*c;h*=del;if(Math.abs(del-1)<EPS)break;
  }
  return h;
}
function lgamma(x){
  const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
  let y=x,tmp=x+5.5;tmp-=(x+0.5)*Math.log(tmp);let ser=1.000000000190015;
  for(let j=0;j<6;j++)ser+=c[j]/++y;
  return -tmp+Math.log(2.5066282746310005*ser/x);
}
function pLabel(p){
  if(p<0.001)return 'p < 0.001';
  if(p<0.05)return `p = ${p.toFixed(3)}`;
  return `ns (p = ${p.toFixed(2)})`;
}

const {t,df,p}=welch(valN,valB);

// ── draw ───────────────────────────────────────────────────────────────────────
const W=300,H=300,ml=58,mr=20,mt=24,mb=48;
const cw=W-ml-mr,ch=H-mt-mb;
const maxY=Math.max(groupMeans.NgTG+groupSEM.NgTG,groupMeans.NgB+groupSEM.NgB)*1.35;
const y=v=>mt+ch*(1-v/maxY);
const nTicks=5, tickStep=maxY/nTicks;

const x1=ml+cw*0.28, x2=ml+cw*0.72, bw=52;
const svg=document.getElementById('chart');

for(let i=0;i<=nTicks;i++){
  const val=tickStep*i, yy=y(val);
  const line=document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1',ml);line.setAttribute('x2',ml+cw);
  line.setAttribute('y1',yy);line.setAttribute('y2',yy);
  line.setAttribute('class',i===0?'axis-line':'grid-line');
  svg.appendChild(line);
  if(i>0){
    const lbl=document.createElementNS('http://www.w3.org/2000/svg','text');
    lbl.setAttribute('x',ml-5);lbl.setAttribute('y',yy+4);
    lbl.setAttribute('text-anchor','end');lbl.setAttribute('class','tick-label');
    lbl.textContent=Math.round(val);
    svg.appendChild(lbl);
  }
}

const axlbl=document.createElementNS('http://www.w3.org/2000/svg','text');
axlbl.setAttribute('transform',`translate(13,${mt+ch/2}) rotate(-90)`);
axlbl.setAttribute('text-anchor','middle');axlbl.setAttribute('class','axis-label');
axlbl.textContent='Cells / mm²';
svg.appendChild(axlbl);

[['NgTG',x1,ngtg],['NgB',x2,ngb]].forEach(([grp,cx,animals])=>{
  const gm=groupMeans[grp],gs=groupSEM[grp],col=COLORS[grp];

  const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
  rect.setAttribute('x',cx-bw/2);rect.setAttribute('width',bw);
  rect.setAttribute('y',y(gm));rect.setAttribute('height',Math.max(0,y(0)-y(gm)));
  rect.setAttribute('fill',col);rect.setAttribute('opacity','0.82');
  rect.setAttribute('class','bar');rect.setAttribute('rx','2');
  svg.appendChild(rect);

  const errTop=y(gm+gs),errBot=y(Math.max(0,gm-gs));
  [[cx,errTop,cx,errBot],[cx-6,errTop,cx+6,errTop],[cx-6,errBot,cx+6,errBot]].forEach(([x1e,y1e,x2e,y2e])=>{
    const el=document.createElementNS('http://www.w3.org/2000/svg','line');
    el.setAttribute('x1',x1e);el.setAttribute('y1',y1e);el.setAttribute('x2',x2e);el.setAttribute('y2',y2e);
    el.setAttribute('stroke','#333');el.setAttribute('class','err-cap');
    svg.appendChild(el);
  });

  animals.forEach((a,i)=>{
    const jx=cx-14+(i%3)*14+(Math.floor(i/3)%2)*7;
    const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx',jx);dot.setAttribute('cy',y(a.mean));
    dot.setAttribute('r','3');dot.setAttribute('fill','#fff');
    dot.setAttribute('stroke',col);dot.setAttribute('stroke-width','1.5');
    dot.setAttribute('class','bar');
    dot.addEventListener('mouseenter',e=>{
      const tip=document.getElementById('tooltip');
      tip.innerHTML=`Animal ${a.id} (${grp})<br>Mean: ${a.mean.toFixed(1)} /mm²<br>SEM: ±${a.sem.toFixed(1)}<br>n=${a.n} sections`;
      tip.style.opacity=1;tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY-8)+'px';
    });
    dot.addEventListener('mousemove',e=>{
      const tip=document.getElementById('tooltip');
      tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY-8)+'px';
    });
    dot.addEventListener('mouseleave',()=>{document.getElementById('tooltip').style.opacity=0;});
    svg.appendChild(dot);
  });

  const xl=document.createElementNS('http://www.w3.org/2000/svg','text');
  xl.setAttribute('x',cx);xl.setAttribute('y',mt+ch+16);
  xl.setAttribute('text-anchor','middle');xl.setAttribute('class','tick-label');
  xl.setAttribute('font-weight','600');xl.setAttribute('fill',col);
  xl.textContent=grp;
  svg.appendChild(xl);
});

const bracketY=y(Math.max(groupMeans.NgTG+groupSEM.NgTG,groupMeans.NgB+groupSEM.NgB))-14;
[[x1,bracketY,x1,bracketY-5],[x1,bracketY-5,x2,bracketY-5],[x2,bracketY-5,x2,bracketY]].forEach(([ax,ay,bx,by])=>{
  const l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',ax);l.setAttribute('y1',ay);l.setAttribute('x2',bx);l.setAttribute('y2',by);
  l.setAttribute('class','sig-line');svg.appendChild(l);
});
const plbl=document.createElementNS('http://www.w3.org/2000/svg','text');
plbl.setAttribute('x',(x1+x2)/2);plbl.setAttribute('y',bracketY-8);
plbl.setAttribute('text-anchor','middle');plbl.setAttribute('class','p-label');
plbl.textContent=pLabel(p);
svg.appendChild(plbl);

// ── table ──────────────────────────────────────────────────────────────────────
const tbl=document.getElementById('data-table');
tbl.innerHTML=`<tr><th>Animal</th><th>Group</th><th>Genotype</th><th>Mean /mm²</th><th>SEM</th><th>n sections</th></tr>`;
perAnimal.forEach(a=>{
  const cls=a.grp==='NgTG'?'ngtg':'ngb';
  const gt=a.grp==='NgTG'?'WT':'Tg';
  tbl.innerHTML+=`<tr><td>${a.id}</td><td class="${cls}">${a.grp}</td><td>${gt}</td><td>${a.mean.toFixed(1)}</td><td>${a.sem.toFixed(1)}</td><td>${a.n}</td></tr>`;
});
tbl.innerHTML+=`<tr><td colspan="6" style="text-align:left;padding-top:8px;color:#555">
  NgTG mean=${groupMeans.NgTG.toFixed(1)}, SEM=${groupSEM.NgTG.toFixed(1)} &nbsp;|&nbsp;
  NgB mean=${groupMeans.NgB.toFixed(1)}, SEM=${groupSEM.NgB.toFixed(1)} &nbsp;|&nbsp;
  ${pLabel(p)}, t(${df.toFixed(1)})=${t.toFixed(3)}
</td></tr>`;
</script>
